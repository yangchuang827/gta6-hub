name: Daily GTA6 News Fetch

on:
  schedule:
    # Run at 06:00 and 18:00 UTC (14:00 and 02:00 Beijing time)
    - cron: '0 6,18 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  fetch-and-process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch RSS feeds
        run: node scripts/fetch-rss.js

      - name: Check for new articles
        id: check
        run: |
          if [ -f scripts/cache/feeds.json ]; then
            COUNT=$(node -e "const d=require('./scripts/cache/feeds.json'); console.log(d.length)")
            echo "count=$COUNT" >> $GITHUB_OUTPUT
            echo "Found $COUNT new articles to process"
          else
            echo "count=0" >> $GITHUB_OUTPUT
            echo "No feeds file found"
          fi

      - name: AI Process articles
        if: steps.check.outputs.count != '0'
        run: node scripts/ai-process.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.0-flash' }}

      - name: Quality check
        if: steps.check.outputs.count != '0'
        run: node scripts/quality-check.js
        continue-on-error: true

      - name: Build site (verify no errors)
        if: steps.check.outputs.count != '0'
        run: npm run build
        continue-on-error: true

      - name: Create Pull Request
        if: steps.check.outputs.count != '0'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'auto: AI-generated news articles'
          title: '🤖 AI News Update - ${{ github.run_id }}'
          body: |
            ## Automated News Update

            This PR contains AI-generated bilingual articles from the daily RSS fetch.

            ### What's included
            - New articles generated by Gemini AI from RSS sources
            - Both Chinese and English versions
            - Quality check results (see workflow logs)

            ### Review checklist
            - [ ] Article titles are accurate and SEO-friendly
            - [ ] Content is original and adds value (not just translation)
            - [ ] Source classification is correct (official/media/community/rumor)
            - [ ] No factual errors (dates, prices, names)
            - [ ] Markdown formatting is correct

            ### Files changed
            - `src/data/auto/*.json` - Generated article files
            - `scripts/cache/` - Updated processed slugs cache

            ---
            *Generated by GitHub Actions run #${{ github.run_number }}*
          branch: auto-news
          labels: |
            auto-generated
            needs-review
          delete-branch: false
