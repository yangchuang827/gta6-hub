name: Daily GTA6 News Fetch

on:
  schedule:
    # Run at 06:00 and 18:00 UTC (14:00 and 02:00 Beijing time)
    - cron: '0 6,18 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  fetch-and-process:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch RSS feeds
        run: node scripts/fetch-rss.js

      - name: Check for new articles
        id: check
        run: |
          if [ -f scripts/cache/feeds.json ]; then
            COUNT=$(node -e "const d=require('./scripts/cache/feeds.json'); console.log(d.length)")
            echo "count=$COUNT" >> $GITHUB_OUTPUT
            echo "Found $COUNT new articles to process"
          else
            echo "count=0" >> $GITHUB_OUTPUT
            echo "No feeds file found"
          fi

      - name: AI Process articles
        if: steps.check.outputs.count != '0'
        run: node scripts/ai-process.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}

      - name: Quality check
        if: steps.check.outputs.count != '0'
        # --delete-failed: removes bad articles so the rest can still ship
        run: node scripts/quality-check.js --delete-failed

      - name: Build site (verify no errors)
        if: steps.check.outputs.count != '0'
        run: npm run build

      - name: Commit and push auto articles
        if: steps.check.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/auto/ scripts/cache/
          if git diff --staged --quiet; then
            echo "::error::AI Process ran but produced no article files. Check GEMINI_API_KEY / quota / model availability."
            exit 1
          else
            git commit -m "auto: AI-generated news articles"
            git push origin HEAD:main
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
